services:
  - type: web
    name: upskillOS
    runtime: docker
    dockerfilePath: ./Dockerfile
    dockerContext: .
    envVars:

      # ── Azure OpenAI (Primary LLM) ────────────────────────────────────────
      - key: AZURE_OPENAI_API_KEY
        sync: false
      - key: AZURE_OPENAI_ENDPOINT
        sync: false
      - key: AZURE_OPENAI_DEPLOYMENT
        sync: false
      - key: AZURE_OPENAI_API_VERSION
        value: "2024-02-15-preview"
      - key: AZURE_OPENAI_MODEL
        value: gpt-4o-mini

      # ── Google Gemini (Secondary LLM + Embeddings) ────────────────────────
      - key: GOOGLE_API_KEY
        sync: false
      - key: GOOGLE_API_KEY_2
        sync: false
      - key: GEMINI_MODEL
        value: gemini-3.1-flash-lite-preview

      # ── NVIDIA NIM (Tertiary LLM) ─────────────────────────────────────────
      - key: NIM_API_KEY
        sync: false
      - key: NIM_MODEL
        value: meta/llama-3.3-70b-instruct
      - key: NIM_BASE_URL
        value: https://integrate.api.nvidia.com/v1

      # ── Groq ──────────────────────────────────────────────────────────────
      - key: GROQ_API_KEY
        sync: false
      - key: GROQ_MODEL
        value: qwen-qwq-32b

      # ── Auth ──────────────────────────────────────────────────────────────
      - key: JWT_SECRET_KEY
        sync: false

      # ── App Config ────────────────────────────────────────────────────────
      - key: COURSE_DATA_PATH
        value: /app/Data/nptel_courses_with_embeddings.xlsx
      - key: PYTHONUNBUFFERED
        value: "1"
