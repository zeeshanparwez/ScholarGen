services:
  - type: web
    name: upskillOS
    runtime: docker
    dockerfilePath: ./Dockerfile
    dockerContext: .
    envVars:

      # ── Google / Gemini ──────────────────────────────────────────────────────
      - key: GOOGLE_API_KEY
        sync: false                  # paste in Render dashboard
      - key: GOOGLE_API_KEY_2
        sync: false
      - key: GEMINI_MODEL
        value: gemini-3.1-flash-lite-preview

      # ── Auth ─────────────────────────────────────────────────────────────────
      - key: JWT_SECRET_KEY
        sync: false

      # ── Groq ─────────────────────────────────────────────────────────────────
      - key: GROQ_API_KEY
        sync: false
      - key: GROQ_MODEL
        value: openai/gpt-oss-120b

      # ── NVIDIA NIM ───────────────────────────────────────────────────────────
      - key: NIM_API_KEY
        sync: false
      - key: NIM_MODEL
        value: meta/llama-3.3-70b-instruct
      - key: NIM_BASE_URL
        value: https://integrate.api.nvidia.com/v1

      # ── App config ───────────────────────────────────────────────────────────
      - key: COURSE_DATA_PATH
        value: /app/Data/nptel_courses_with_embeddings.xlsx
      - key: PYTHONUNBUFFERED
        value: "1"
